name: Update Profile Cards

on:
  schedule:
    # Daily at 08:17 UTC. The non-zero minute avoids GitHub's top-of-hour
    # scheduling congestion. Cron on GitHub Actions is always UTC.
    - cron: "17 8 * * *"
  # Lets you refresh manually from the Actions tab (useful after tweaking).
  workflow_dispatch:

# Never let two runs race each other on `git push`.
concurrency:
  group: profile-cards
  cancel-in-progress: false

permissions:
  contents: write # REQUIRED. The default GITHUB_TOKEN is read-only; without
                  # this line the commit silently does nothing.

jobs:
  update-cards:
    name: Generate stats cards and refresh project list
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # ------------------------------------------------------------------
      # Collect everything the cards need in a single GraphQL round-trip.
      # Public data only, so the built-in GITHUB_TOKEN is sufficient.
      # ------------------------------------------------------------------
      - name: Collect profile data
        env:
          GH_TOKEN: ${{ secrets.PAT || github.token }}
          OWNER: ${{ github.repository_owner }}
          FEATURED: >-
            video-player,KnowYourClassAction,marginalia,AI-Writer,
            cbz-viewer-v3,ScholarScraper,YoutubeAutomator,Contributor
        run: |
          set -euo pipefail
          gh api graphql -F login="$OWNER" -f query='
            query($login: String!) {
              user(login: $login) {
                followers { totalCount }
                repositories(
                  first: 100
                  privacy: PUBLIC
                  ownerAffiliations: OWNER
                  orderBy: { field: PUSHED_AT, direction: DESC }
                ) {
                  totalCount
                  nodes {
                    name
                    description
                    isFork
                    isArchived
                    stargazerCount
                    url
                    primaryLanguage { name color }
                  }
                }
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays { date contributionCount }
                    }
                  }
                }
              }
            }
          ' > data.raw.json

          node .github/scripts/build-assets.mjs

      # ------------------------------------------------------------------
      # Rewrite the project grid in README.md
      # ------------------------------------------------------------------
      - name: Refresh project grid
        run: node .github/scripts/recent-projects.mjs

      # ------------------------------------------------------------------
      # Refuse to publish a broken page.
      #
      # Everything above can succeed while producing something visibly wrong
      # -- an unresolved field yields an empty href, a renamed asset leaves a
      # dangling reference. GitHub renders the result with no way to report
      # that back, so the check has to happen here, before the commit. The
      # `url` bug in particular shipped six dead links unnoticed.
      # ------------------------------------------------------------------
      - name: Validate generated output
        run: node .github/scripts/validate.mjs

      # ------------------------------------------------------------------
      # Commit whatever changed.
      #
      # The remote can advance between checkout and push -- a human
      # committing, or a second run. `concurrency` above stops two *runs*
      # colliding but cannot stop a human, so the push can still be rejected.
      #
      # An earlier version retried with `git pull --rebase`. That was wrong:
      # both sides rewrite the same files (assets/*.svg and the README block),
      # so the rebase conflicts, leaves the tree mid-rebase on a detached
      # HEAD, and `set -e` aborts the step. Regenerating on top of the new
      # tip is both correct and simpler -- the output is a pure function of
      # the API data, so re-running it is deterministic and cannot conflict.
      # ------------------------------------------------------------------
      - name: Commit updated cards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # data.raw.json is kept until the very end: the retry path below
          # re-runs build-assets.mjs, which reads it. `git reset --hard` does
          # not touch untracked files, so it survives a rebuild.
          rm -f repos.local.json .projects.json
          git add assets/ README.md

          # Nothing changed (quiet day) — exit successfully without a commit.
          if git diff --cached --quiet; then
            echo "No changes to commit."
            rm -f data.raw.json
            exit 0
          fi

          git commit -m "chore: refresh profile cards"

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt ${attempt}."
              rm -f data.raw.json
              exit 0
            fi

            echo "::warning::Push rejected on attempt ${attempt}; remote moved."
            git fetch --quiet origin "${GITHUB_REF_NAME}"

            # Rebuild from the remote tip rather than merging onto a stale
            # checkout. The generated files are a pure function of the API
            # data, so re-running is deterministic and cannot conflict the
            # way `git pull --rebase` did.
            git reset --hard "origin/${GITHUB_REF_NAME}"
            node .github/scripts/build-assets.mjs
            node .github/scripts/recent-projects.mjs
            node .github/scripts/validate.mjs

            rm -f repos.local.json .projects.json
            git add assets/ README.md

            # The remote already carried this output, so there is nothing
            # left to push.
            if git diff --cached --quiet; then
              echo "Remote already up to date after reset; nothing to commit."
              rm -f data.raw.json
              exit 0
            fi

            git commit -m "chore: refresh profile cards"
          done

          echo "Unable to push after 3 attempts." >&2
          rm -f data.raw.json
          exit 1