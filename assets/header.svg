<svg xmlns="http://www.w3.org/2000/svg" width="720" height="118" viewBox="0 0 720 118" role="img" aria-label="&gt; automation scripts &amp; pipelines, &gt; file viewers &amp; readers, &gt; web apps &amp; weekend experiments, &gt; python / js / ts / html / wolfram">
  <style>
    @keyframes typeIn {
      0%, 12%   { opacity: 0; }
      4%, 30%   { opacity: 1; }
      40%, 100% { opacity: 0; }
    }
    @keyframes caret {
      0%, 45%   { opacity: 1; }
      50%, 95%  { opacity: 0; }
      100%      { opacity: 1; }
    }
    .line {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 19px;
      font-weight: 600;
      opacity: 0;
      animation: typeIn 7.5s linear infinite;
    }
    .caret {
      animation: caret 0.9s steps(1) infinite;
    }
  </style>
  <g transform="translate(28 0)">
    <text x="0" y="44" class="line" fill="#58a6ff" style="animation-delay:0s">&gt; automation scripts &amp; pipelines</text>
    <text x="0" y="78" class="line" fill="#a371f7" style="animation-delay:0.55s">&gt; file viewers &amp; readers</text>
    <text x="0" y="112" class="line" fill="#3fb950" style="animation-delay:1.1s">&gt; web apps &amp; weekend experiments</text>
    <text x="0" y="146" class="line" fill="#f0883e" style="animation-delay:1.6500000000000001s">&gt; python / js / ts / html / wolfram</text>
    <rect class="caret" x="0" y="25" width="10" height="22" rx="2" fill="#f0883e"/>
  </g>
</svg>
