<svg xmlns="http://www.w3.org/2000/svg" width="780" height="190" viewBox="0 0 780 190" role="img" aria-label="Kevin Lu — I build small tools that do one job properly.">
  <style>
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(26px, -18px) scale(1.06); }
      66%      { transform: translate(-22px, 14px) scale(0.97); }
    }
    @keyframes sweep {
      from { transform: translateX(-120%); }
      to   { transform: translateX(220%); }
    }
    @keyframes glow {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 0.95; }
    }
    .blob   { animation: drift 26s ease-in-out infinite; transform-origin: center; }
    .blob-2 { animation-duration: 34s; animation-direction: reverse; }
    .sheen  { animation: sweep 7.5s linear infinite; }
    .halo   { animation: glow 4.5s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0.5" y="0.5" width="779" height="189" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="780" height="190" fill="url(#backdrop)"/>
    <circle class="blob"   cx="130" cy="60"  r="150" fill="url(#glowA)"/>
    <circle class="blob blob-2" cx="660" cy="150" r="170" fill="url(#glowB)"/>
    <circle class="blob"   cx="420" cy="200" r="130" fill="url(#glowC)"/>
    <rect class="sheen" x="0" y="0" width="180" height="190" fill="#ffffff" opacity="0.045" transform="skewX(-18)"/>
  </g>

  <circle class="halo" cx="390" cy="95" r="120" fill="none" stroke="#1f6feb" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="0.5" y="0.5" width="779" height="189" rx="18" fill="none" stroke="#30363d"/>

  <text x="40" y="92" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="url(#title)">Kevin Lu</text>
  <text x="40" y="128" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#9198a1">I build small tools that do one job properly.</text>
  <g transform="translate(40 150)">
    <rect width="104" height="24" rx="12" fill="#1f6feb" fill-opacity="0.16" stroke="#1f6feb" stroke-opacity="0.45"/>
    <text x="52" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#79c0ff">automation</text>
    <rect x="112" width="86" height="24" rx="12" fill="#8957e5" fill-opacity="0.16" stroke="#8957e5" stroke-opacity="0.45"/>
    <text x="155" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d2a8ff">file viewers</text>
    <rect x="206" width="72" height="24" rx="12" fill="#238636" fill-opacity="0.18" stroke="#238636" stroke-opacity="0.5"/>
    <text x="242" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#56d364">web apps</text>
  </g>
  <text x="740" y="168" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6e7681">github.com/Chickenman67</text>
</svg>
